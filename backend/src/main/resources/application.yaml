spring:
  application:
    name: vakilconnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vakilconnect}
    username: ${DB_USERNAME:arshraj}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # Multipart uploads (AI-1).
  #
  # THIS BLOCK IS NOT OPTIONAL. Spring Boot's DEFAULT max-file-size is 1MB, so
  # before AI-1 any upload above that was rejected by the container with a
  # MaxUploadSizeExceededException - which, until this phase, had no handler and
  # surfaced as a 500. There was no upload endpoint, so nobody noticed.
  #
  # DELIBERATELY LARGER THAN vakilconnect.ai.document.max-file-size (10MB). The
  # container rejects an oversized part BEFORE any controller method runs, so if
  # these were equal - or smaller - the application's own check could never fire
  # and every oversize would arrive as a container error instead of a described
  # one. The gap is what lets the service produce DOCUMENT_TOO_LARGE with the
  # actual configured limit in the message.
  #
  # Both paths map to 413 + DOCUMENT_TOO_LARGE anyway (see
  # GlobalExceptionHandler), because this ordering is easy to get wrong and the
  # client should not be able to tell the difference.
  #
  # max-request-size exceeds max-file-size to leave room for part headers and
  # any future second field; a single 12MB file in a 12MB request would fail on
  # the envelope, not the file.
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:16MB}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

vakilconnect:
  migration:
    reconciliation-ttl: ${MIGRATION_RECONCILIATION_TTL:PT5M}

  identity:
    token-pepper: ${TOKEN_PEPPER:}

    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}

    verification-enforced: ${EMAIL_VERIFICATION_ENFORCED:false}

    verification-token-ttl: ${VERIFICATION_TOKEN_TTL:PT24H}
    reset-token-ttl: ${RESET_TOKEN_TTL:PT30M}
    resend-cooldown: ${RESEND_COOLDOWN:PT60S}

    takeover-threshold: ${TAKEOVER_THRESHOLD:P7D}

    purge-enabled: ${IDENTITY_PURGE_ENABLED:true}
    token-purge-retention: ${TOKEN_PURGE_RETENTION:P30D}
    unverified-purge-after: ${UNVERIFIED_PURGE_AFTER:P30D}

  # -------------------------------------------------------------------------
  # Email transport (Phase 3).
  #
  # PROVIDER DEFAULTS TO console, AND THAT IS A SAFETY PROPERTY, not laziness.
  # An unconfigured environment gets the sender that CANNOT mail a real person;
  # application-prod.yaml pins `resend`. Selection is by property rather than
  # by @Profile because this project has no `dev` profile - a local run
  # activates none at all - so a profile-gated console sender would never exist
  # locally and the Resend adapter would be chosen on a developer's laptop.
  #
  # api-key and from are intentionally NOT validated here: they are required
  # only when provider=resend, and ResendEmailSender's constructor - which only
  # exists in that case - refuses to start without them.
  #
  # Note there is no base-URL key. Links are built from
  # vakilconnect.identity.public-base-url, which already exists above. A second
  # copy would be two sources of truth for one value.
  # -------------------------------------------------------------------------
  email:
    provider: ${EMAIL_PROVIDER:console}
    api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:}
    from-name: ${EMAIL_FROM_NAME:}

  # -------------------------------------------------------------------------
  # AI foundation (AI-0).
  #
  # NOTHING CALLS AN LlmClient YET. There is no AI endpoint, no job and no
  # service that reaches for one - AI-0 delivers the abstraction and the two
  # implementations behind it, nothing more. These keys exist now so the
  # configuration surface ships with the code that reads it.
  #
  # THERE IS NO API KEY, ANYWHERE, BY DESIGN. The real provider is Ollama
  # running locally, so the entire AI feature is usable with no billing
  # account and no paid service. A hosted provider can be added later as
  # another LlmClient implementation without changing a single caller.
  #
  # PROVIDER DEFAULTS TO stub, IN EVERY ENVIRONMENT INCLUDING PRODUCTION.
  # Unlike the email provider, this one is NOT pinned in application-prod.yaml.
  # The console email sender is dangerous in production - it logs real users'
  # verification links - so pinning `resend` there is a safety measure. Here
  # the reasoning is the opposite direction: Render does not run Ollama, so
  # production stays in stub mode until there is an explicit decision about
  # how to host the AI demo. The stub is inert at AI-0 because no caller
  # exists.
  #
  # base-url and model are read only when provider=ollama. They are declared
  # unconditionally so `AI_PROVIDER=ollama` is the ONLY variable a developer
  # has to set to go live locally.
  #
  # Design: docs/AI-ARCHITECTURE-AND-ROADMAP.md
  # -------------------------------------------------------------------------
  ai:
    provider: ${AI_PROVIDER:stub}

    # Ollama's default listen address. Trailing slashes are stripped at bind
    # time, so http://localhost:11434/ is the same configuration.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

    # Must already be pulled: `ollama pull llama3.2`. A property, not a
    # constant, because which model is sensible depends on the machine -
    # 3B on a laptop, something larger with a GPU.
    model: ${AI_MODEL:llama3.2}

    # Low by default. Legal answers should be reproducible and boring; this is
    # not a creative-writing workload.
    temperature: ${AI_TEMPERATURE:0.2}

    # Sent to Ollama as `num_predict`. On local inference this is a TIME
    # control rather than a cost control: every token is CPU or GPU work on
    # the developer's own machine, so an unbounded generation is a request
    # that looks like a hang.
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}

    # Finite on purpose. RestClient's default read timeout is unlimited, and a
    # model that stalls mid-generation would hold a request thread until the
    # process restarts.
    #
    # READ IS 120s, FAR LONGER THAN A HOSTED API WOULD NEED. Local CPU
    # inference is slow - a 3B model answering a paragraph takes tens of
    # seconds, and a cold start where the model is loaded into RAM can exceed
    # a minute. A cloud-tuned timeout would manufacture failures out of
    # healthy calls. Connect stays short: to localhost this either succeeds
    # at once or Ollama is not running.
    connect-timeout: ${AI_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${AI_READ_TIMEOUT:PT120S}

    # -------------------------------------------------------------------------
    # Document uploads (AI-1).
    #
    # Bound by AiDocumentProperties, which is SEPARATE from AiProperties on
    # purpose: model configuration and upload limits are different concerns with
    # different lifetimes, and AiPropertiesTest pins AiProperties' component set
    # so nothing is added there without a security review.
    #
    # 10MB, AND THE NUMBER IS LOAD-BEARING. Document bytes are stored in a
    # `bytea` column in PostgreSQL - no S3, no R2, no second service - on a
    # free-tier Neon plan with a storage cap. This ceiling is what keeps that
    # viable, and it also bounds the heap: an upload is read fully into memory
    # before it is written, because a bytea value has to be materialised anyway.
    #
    # MUST STAY BELOW spring.servlet.multipart.max-file-size above, or the
    # application's own check is unreachable. See the note there.
    # -------------------------------------------------------------------------
    document:
      max-file-size: ${AI_DOCUMENT_MAX_FILE_SIZE:10MB}

    # -------------------------------------------------------------------------
    # Embeddings (AI-2).
    #
    # SAME PROVIDER PATTERN AS vakilconnect.ai.provider, and the same safe
    # default: `stub` produces deterministic hash-derived vectors that need no
    # server and no model, so a fresh clone and CI both work with no AI setup.
    # `ollama` uses the real model at vakilconnect.ai.base-url - the SAME server
    # as chat, which is why there is no second base-url here.
    #
    # NO API KEY. Local inference authenticates nothing; the zero-cost
    # requirement holds through AI-2 unchanged.
    #
    # nomic-embed-text: 768 dimensions, ~274MB, CPU-friendly, trained for
    # RETRIEVAL rather than sentence similarity, 8192-token context so no chunk
    # is silently truncated. mxbai-embed-large (1024d, ~670MB) is the upgrade if
    # retrieval quality disappoints - but see the warning on `dimension`.
    #
    # DIMENSION IS NOT A FREE-FORM SETTING. It must equal the vector(n) width in
    # V9, which SQL cannot parameterise. AiDocumentChunkSchemaIT reads the real
    # column typmod from pg_attribute and asserts they match, so changing one
    # alone fails the build - correctly, because a new dimension needs an ALTER
    # COLUMN and a full re-ingest of every document.
    # -------------------------------------------------------------------------
    embedding:
      provider: ${AI_EMBEDDING_PROVIDER:stub}
      model: ${AI_EMBEDDING_MODEL:nomic-embed-text}
      dimension: ${AI_EMBEDDING_DIMENSION:768}

    # -------------------------------------------------------------------------
    # Chunking (AI-2).
    #
    # 1200 CHARACTERS, ~250-300 tokens. Legal documents are organised in
    # clauses, and a clause plus its sub-points usually fits. The common
    # 500-character default routinely severs a clause from its own conditions -
    # "the tenant shall pay" without "unless clause 7 applies" - which for legal
    # text is worse than returning nothing. Much larger dilutes the embedding:
    # one vector covering four unrelated clauses is close to all and precise
    # about none.
    #
    # 200 OVERLAP, about a sixth. Legal text refers backwards constantly ("such
    # notice", "the said premises"), so a definition sitting on a boundary must
    # appear in both neighbours. More would mostly duplicate storage and
    # embedding time.
    #
    # max-chunks-per-document is a COST CEILING, not a quality knob: every chunk
    # is one local inference call, and without it a maximum-size upload could
    # occupy the machine for minutes.
    # -------------------------------------------------------------------------
    ingestion:
      chunk-size: ${AI_CHUNK_SIZE:1200}
      chunk-overlap: ${AI_CHUNK_OVERLAP:200}
      max-chunks-per-document: ${AI_MAX_CHUNKS_PER_DOCUMENT:2000}

    # -------------------------------------------------------------------------
    # Retrieval / RAG (AI-3).
    #
    # top-k 6: enough that a question spanning two clauses gets both, few enough
    # that the prompt does not fill with weakly-related passages. Every extra
    # chunk is more tokens for a local CPU to read.
    #
    # max-distance is COSINE DISTANCE, so LOWER IS MORE SIMILAR: 0 identical
    # direction, 1 orthogonal, 2 opposite. 0.6 is deliberately permissive -
    # being too strict is the worse failure, because the user gets "insufficient
    # evidence" for a question their document does answer and concludes the
    # feature is broken. A slightly weak passage in the context is something the
    # grounded prompt already tells the model to ignore.
    #
    # THIS IS THE VALUE MOST WORTH TUNING once there is evaluation data. It is
    # informed by how nomic-embed-text scores, not measured.
    #
    # max-context-characters bounds the prompt. Without it, top-k x chunk-size
    # is 7200 characters of context alone, and raising top-k later would
    # silently push past a small model's window - where the first thing to fall
    # out is the SYSTEM PROMPT. It is a prompt-injection control, not only a
    # cost one.
    #
    # max-question-characters bounds the other end for the same reason.
    # -------------------------------------------------------------------------
    retrieval:
      top-k: ${AI_RETRIEVAL_TOP_K:6}
      max-distance: ${AI_RETRIEVAL_MAX_DISTANCE:0.6}
      max-context-characters: ${AI_MAX_CONTEXT_CHARACTERS:8000}
      max-question-characters: ${AI_MAX_QUESTION_CHARACTERS:4000}

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}