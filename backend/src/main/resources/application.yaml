spring:
  application:
    name: vakilconnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vakilconnect}
    username: ${DB_USERNAME:arshraj}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.springframework.security: DEBUG

# JWT_SECRET is intentionally NOT defaulted: the app must fail to start if it
# is missing, so a known/committed secret can never be used by accident.
# Generate one with:  openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}