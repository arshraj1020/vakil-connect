# Test profile. The datasource URL/credentials are injected at runtime by
# AbstractIntegrationTest via @DynamicPropertySource (Testcontainers), so they
# are intentionally not declared here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework.security: WARN

# No servlet container starts under @SpringBootTest(MOCK), so the management
# port is never bound and the actuator endpoints are not reachable here. The
# meters themselves are asserted directly against the MeterRegistry.
#
# TTL zero so the reconciliation gauges re-query on every read: a test that
# changes the data and then reads a gauge must see the change, not a cached
# value from five minutes of wall-clock ago.
vakilconnect:
  migration:
    reconciliation-ttl: PT0S

  identity:
    # REQUIRED for the context to start: IdentityProperties.tokenPepper is
    # @NotBlank, and application.yaml resolves it from ${TOKEN_PEPPER:} which is
    # empty on a developer machine. Without this line EVERY integration test
    # fails at context load, not at the assertion.
    #
    # A fixed, obviously-fake value: hashes must be reproducible across runs for
    # TokenHasher's determinism assertions, and this must never resemble a real
    # secret that could be copied into an environment file.
    token-pepper: test-only-pepper-not-a-real-secret

# Fixed, test-only signing key (the app requires JWT_SECRET with no default).
jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWludGVncmF0aW9uLXRlc3Rz
  expiration: 86400000
