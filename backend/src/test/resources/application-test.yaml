# Test profile. The datasource URL/credentials are injected at runtime by
# AbstractIntegrationTest via @DynamicPropertySource (Testcontainers), so they
# are intentionally not declared here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  main:
    # Required so a test can replace `emailTaskExecutor` (defined in AsyncConfig)
    # with a SYNCHRONOUS executor. Without a synchronous executor the
    # AFTER_COMMIT email assertions race the pool thread: they pass locally and
    # fail intermittently in CI, which is the worst failure mode available.
    #
    # Scoped to the test profile only. Production keeps the default, so a
    # genuine duplicate-bean mistake still fails the build there.
    allow-bean-definition-overriding: true

logging:
  level:
    org.springframework.security: WARN

# No servlet container starts under @SpringBootTest(MOCK), so the management
# port is never bound and the actuator endpoints are not reachable here. The
# meters themselves are asserted directly against the MeterRegistry.
#
# TTL zero so the reconciliation gauges re-query on every read: a test that
# changes the data and then reads a gauge must see the change, not a cached
# value from five minutes of wall-clock ago.
vakilconnect:
  migration:
    reconciliation-ttl: PT0S

  identity:
    # REQUIRED for the context to start: IdentityProperties.tokenPepper is
    # @NotBlank, and application.yaml resolves it from ${TOKEN_PEPPER:} which is
    # empty on a developer machine. Without this line EVERY integration test
    # fails at context load, not at the assertion.
    #
    # A fixed, obviously-fake value: hashes must be reproducible across runs for
    # TokenHasher's determinism assertions, and this must never resemble a real
    # secret that could be copied into an environment file.
    token-pepper: test-only-pepper-not-a-real-secret

  # Console sender for the whole suite: no test may ever reach a real provider.
  # Tests that need the Resend adapter build it in isolation with
  # ApplicationContextRunner and a MockRestServiceServer, never here.
  email:
    provider: console

  # Stub model for the whole suite: NO TEST MAY EVER CALL AN INFERENCE SERVER.
  # A real call would be nondeterministic, slow enough to dominate the build,
  # and dependent on whether the machine running the tests happens to have
  # Ollama installed and the right model pulled - so the suite would pass on a
  # developer's laptop and fail in CI, which is the worst failure mode
  # available.
  #
  # Redundant with application.yaml's ${AI_PROVIDER:stub} default, and pinned
  # anyway: the default protects only an environment where AI_PROVIDER is
  # unset, and a developer who exports AI_PROVIDER=ollama in their shell to
  # try the real thing would otherwise have the entire test suite follow them
  # into localhost:11434.
  #
  # Tests that need the Ollama adapter build it in isolation with
  # MockRestServiceServer, never here. See OllamaLlmClientTest.
  ai:
    provider: stub

    # A DELIBERATELY TINY UPLOAD LIMIT, so the oversized-file test can prove the
    # rejection with a ~100KB payload instead of generating 11MB.
    #
    # Set here rather than with @TestPropertySource on the one test class that
    # needs it: an inline property override forks a SECOND Spring context, and
    # this suite's contexts each start Flyway against Testcontainers. Pinning it
    # for the whole suite keeps every integration test on the single cached
    # context, which is worth far more than the realism of a 10MB limit in a
    # test that only cares about the comparison.
    #
    # The container limit (spring.servlet.multipart.max-file-size, 12MB) is left
    # alone, so the application's own check is still the one that fires - which
    # is the path production uses and therefore the path worth testing.
    document:
      max-file-size: 64KB

    # Stub embeddings for the whole suite: NO TEST MAY EVER CALL OLLAMA. A real
    # call would be nondeterministic, slow enough to dominate the build, and
    # dependent on whether the machine happens to have the model pulled - so the
    # suite would pass locally and fail in CI.
    #
    # THE DIMENSION IS THE REAL 768, NOT A CONVENIENT SMALL NUMBER. The stub
    # must produce vectors the real vector(768) column accepts, or every
    # persistence test would pass against a width production never sees and the
    # first real ingestion would fail on a constraint no test had exercised.
    embedding:
      provider: stub
      model: nomic-embed-text
      dimension: 768

    # Production values, deliberately. Chunking behaviour is what the tests
    # assert, so shrinking these would test a configuration nobody runs.
    ingestion:
      chunk-size: 1200
      chunk-overlap: 200
      max-chunks-per-document: 2000

    # Production values. Retrieval behaviour is what the tests assert, so
    # loosening the threshold here would test a configuration nobody runs.
    #
    # The 0.6 threshold works with StubEmbeddingClient for a specific reason
    # worth stating: the stub is DETERMINISTIC over text, so embedding a query
    # whose text exactly matches a chunk yields the identical vector and a
    # cosine distance of 0, while any unrelated text gives roughly 1.0 (random
    # 768-dimensional vectors are near-orthogonal). That cleanly separates
    # "relevant" from "irrelevant" without any semantics, which is what lets
    # retrieval be tested at all without a real model.
    retrieval:
      top-k: 6
      max-distance: 0.6
      max-context-characters: 8000
      max-question-characters: 4000

# Fixed, test-only signing key (the app requires JWT_SECRET with no default).
jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWludGVncmF0aW9uLXRlc3Rz
  expiration: 86400000
